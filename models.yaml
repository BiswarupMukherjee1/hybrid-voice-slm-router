# Models benchmarked. `pattern` picks the GGUF file inside the Hugging Face repo
# (case-insensitive), so exact file names do not need to be hard-coded.
# optional: true -> skipped with a warning if the download fails (e.g. a gated repo).
models:
  - name: qwen2.5-0.5b-q4
    repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
    pattern: "*q4_k_m.gguf"
  - name: qwen2.5-1.5b-q4
    repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
    pattern: "*q4_k_m.gguf"
  - name: qwen2.5-1.5b-q8
    repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
    pattern: "*q8_0.gguf"
  - name: llama3.2-1b-q4
    repo: bartowski/Llama-3.2-1B-Instruct-GGUF
    pattern: "*Q4_K_M.gguf"
  - name: gemma3-1b-q4
    repo: bartowski/google_gemma-3-1b-it-GGUF
    pattern: "*Q4_K_M.gguf"
    optional: true
  - name: qwen3-1.7b-q4
    repo: unsloth/Qwen3-1.7B-GGUF
    pattern: "*Q4_K_M.gguf"
    optional: true

# Run this model again with fewer CPU threads, to see what happens when the
# language model has to share the CPU with HMI rendering and audio.
thread_sweep:
  model: qwen2.5-1.5b-q4
  threads: [1, 2]
